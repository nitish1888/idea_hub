apiVersion: v1
kind: Secret
metadata:
  name: idea-hub-updated-secrets
  namespace: trend-analysis-using-ai--runtime-int
  labels:
    app: idea-hub-updated
    paas.company.com/appcode: TAAI-001
type: Opaque
data:
  # Database Configuration (base64 encoded)
  DATABASE_HOST: <BASE64_ENCODED_DB_HOST>
  DATABASE_PORT: <BASE64_ENCODED_DB_PORT>
  DATABASE_NAME: <BASE64_ENCODED_DB_NAME>
  DATABASE_USER: <BASE64_ENCODED_DB_USER>
  DATABASE_PASSWORD: <BASE64_ENCODED_DB_PASSWORD>
  
  # AI Service Configuration (base64 encoded)
  GOOGLE_API_KEY: <BASE64_ENCODED_GOOGLE_API_KEY>
  
---
# Note: Replace the <BASE64_ENCODED_*> values with actual base64 encoded values
# You can encode values using: echo -n "your_value" | base64

# Example encoding commands:
# echo -n "your_db_host" | base64
# echo -n "5432" | base64  
# echo -n "idea_hub_db" | base64
# echo -n "idea_user" | base64
# echo -n "your_db_password" | base64
# echo -n "your_google_api_key" | base64
