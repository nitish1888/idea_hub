apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"idea-hub-mcp-server"}]'
  labels:
    app: idea-hub-updated
    app.kubernetes.io/component: web-frontend
    app.kubernetes.io/instance: idea-hub-updated
    app.kubernetes.io/name: idea-hub-updated
    app.kubernetes.io/part-of: idea-hub-platform
    app.openshift.io/runtime: python
    paas.redhat.com/appcode: TAAI-001
  name: idea-hub-updated
  namespace: trend-analysis-using-ai--runtime-int
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idea-hub-updated
  template:
    metadata:
      labels:
        app: idea-hub-updated
        deployment: idea-hub-updated
    spec:
      containers:
      - name: idea-hub-updated
        image: quay.io/rhn-support-nitsingh/idea-hub-updated:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        # Database Configuration
        - name: PG_DB
          valueFrom:
            secretKeyRef:
              name: idea-hub-updated-secrets
              key: DATABASE_NAME
        - name: PG_USER
          valueFrom:
            secretKeyRef:
              name: idea-hub-updated-secrets
              key: DATABASE_USER
        - name: PG_PASS
          valueFrom:
            secretKeyRef:
              name: idea-hub-updated-secrets
              key: DATABASE_PASSWORD
        - name: PG_HOST
          valueFrom:
            secretKeyRef:
              name: idea-hub-updated-secrets
              key: DATABASE_HOST
        - name: PG_PORT
          valueFrom:
            secretKeyRef:
              name: idea-hub-updated-secrets
              key: DATABASE_PORT
        # AI Service Configuration
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: idea-hub-updated-secrets
              key: GOOGLE_API_KEY
        # MCP Server Configuration (Internal OpenShift Service)
        - name: MCP_SERVER_URL
          value: "https://idea-hub-mcp-server-trend-analysis-using-ai--runtime-int.apps.int.spoke.preprod.us-east-1.aws.paas.redhat.com"
        # Application Configuration
        - name: FLASK_ENV
          value: "production"
        - name: DEBUG
          value: "false"
        # HuggingFace Configuration
        - name: HF_HOME
          value: "/opt/app-root/src/.cache/huggingface"
        - name: TRANSFORMERS_CACHE
          value: "/opt/app-root/src/.cache/huggingface"
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: TRANSFORMERS_OFFLINE
          value: "0"
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 60
          timeoutSeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      imagePullSecrets:
      - name: quay-pull-secret
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: idea-hub-updated
    paas.redhat.com/appcode: TAAI-001
  name: idea-hub-updated
  namespace: trend-analysis-using-ai--runtime-int
spec:
  ports:
  - name: 8080-tcp
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: idea-hub-updated
  type: ClusterIP
